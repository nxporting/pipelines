name = "nxport-pipelines"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "nxporting/pipelines"
# Comma-separated title ids accepted (empty: any)
TITLES = ""

# Per-address submissions per minute (Cloudflare's rate limiting binding; counters are not stored by the worker)
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret: wrangler secret put GITHUB_TOKEN (fine-grained token: Contents read/write on nxporting/pipelines only)
